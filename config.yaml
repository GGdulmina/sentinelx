# SentinelX Configuration
log_paths:
  - /var/log/auth.log
  - /var/log/secure

# Alert thresholds (number of failed attempts)
thresholds:
  info: 1
  warning: 3
  critical: 5

# Reset failure count after this many seconds (default: 86400 = 24 hours)
reset_after: 86400

# Minimum seconds between alerts for same IP (default: 300 = 5 minutes)
alert_cooldown: 300

# State persistence file
state_file: sentinelx_state.json

# Unprivileged user to drop to when run as root
run_as_user: nobody
run_as_group: nogroup

# Output formatting options
output_format:
  icons:
    info: "[  INFO  ]"
    warning: "[WARNING ]"
    critical: "[CRITICAL]"
  column_widths:
    ip: 16
    username: 12
  date_format: ""